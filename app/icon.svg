<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <g fill="#a0602c">
    <!-- tail -->
    <path d="M5.5 15.5 Q2.2 13.8 1.6 10.6" fill="none" stroke="#a0602c" stroke-width="1.6" stroke-linecap="round"/>
    <!-- long body -->
    <rect x="4" y="13" width="18" height="7.5" rx="3.75"/>
    <!-- legs -->
    <rect x="5.5" y="18" width="2.6" height="5" rx="1.2"/>
    <rect x="9" y="18" width="2.6" height="5" rx="1.2"/>
    <rect x="16" y="18" width="2.6" height="5" rx="1.2"/>
    <rect x="19.3" y="18" width="2.6" height="5" rx="1.2"/>
    <!-- neck and head -->
    <path d="M18.5 15 L21.5 9.5 L25 8.5 L26.5 12.5 L22.5 16.5 Z"/>
    <ellipse cx="23.8" cy="10.2" rx="3.6" ry="3"/>
    <!-- long snout -->
    <path d="M25 8.4 L30.6 10.6 Q31.3 11.4 30.4 12 L25.4 12.6 Z"/>
  </g>
  <!-- floppy ear -->
  <path d="M21.6 8.4 Q19.4 10.5 21 14.2 Q23 13.6 23.3 10 Z" fill="#6e3d17"/>
  <!-- eye and nose -->
  <circle cx="25.2" cy="9.6" r="0.75" fill="#1c1209"/>
  <circle cx="30.6" cy="11.1" r="0.85" fill="#1c1209"/>
</svg>
